set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Windows and panes start at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Kill panes and windows without confirmation
bind x kill-pane
bind '&' kill-window

# Open windows and panes in the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Minimal status bar
set -g status-style "bg=default,fg=colour250"
set -g status-left ""
set -g status-right ""
setw -g window-status-current-style "bold"

# Reload configuration
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore sessions on tmux startup
set -g @continuum-restore 'on'

# Automatically save sessions every 15 minutes
set -g @continuum-save-interval '15'

# Keep status enabled for continuum autosaving
set -g status on

run '~/.tmux/plugins/tpm/tpm'
